name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: 'Regenerate the screenshot baselines in the pinned Playwright image'
        type: boolean
        default: false

# A superseded run has nothing left to prove, and the minutes are not free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Suppress git's default-branch hint without writing to the runner's global config.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # Screenshot baselines belong to the platform that took them. That platform
  # is the pinned Playwright container, which anyone can run (D78).
  SNAPSHOT_PLATFORM: playwright-noble
  NODE_VERSION: '22'

jobs:
  # What the rest of the pipeline stands on, reported before anything depends
  # on it. The runner is ephemeral and GitHub-hosted, so tools are installed
  # rather than verified — nothing here outlives the job.
  environment:
    name: Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install poppler
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      # The browser job runs in a container pinned by tag. A tag that has
      # drifted from the installed Playwright means the browser under test is
      # not the browser the baselines were taken with, which is the kind of
      # failure that wastes an afternoon.
      - name: Confirm the Playwright image matches the dependency
        run: |
          set -euo pipefail
          wanted="$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/^[^0-9]*/, '')")"
          pinned="$(grep -oP 'mcr\.microsoft\.com/playwright:v\K[0-9.]+' .github/workflows/ci.yml | head -1)"
          echo "package.json: $wanted, workflow image: $pinned"
          if [ "$wanted" != "$pinned" ]; then
            echo "::error::the Playwright image is pinned to v$pinned but package.json asks for $wanted"
            exit 1
          fi

      - name: Record the environment
        run: |
          set -uo pipefail
          . /etc/os-release
          {
            echo "### Build environment"
            echo
            echo "| What | Version |"
            echo "| --- | --- |"
            echo "| Runner | ${RUNNER_NAME:-hosted} (GitHub-hosted) |"
            echo "| OS | $PRETTY_NAME |"
            echo "| Kernel | $(uname -r) |"
            echo "| Node | $(node --version 2>/dev/null || echo 'not yet installed') |"
            echo "| pdftotext | $(pdftotext -v 2>&1 | head -1) |"
            echo "| Free disk | $(df -h . | awk 'NR==2 {print $4}') |"
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Check (format, lint, types, tests, gate)
    needs: environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The PDF toolkit shells out: its tests run the real binaries.
      - name: Install poppler
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - run: npm ci

      - run: npm run check

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package the distribution
        id: package
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          name="chip-datasheet-agent-${version}-linux-x64-node${NODE_VERSION}-${GITHUB_SHA::7}"
          staging="dist-package/$name"
          mkdir -p "$staging"
          cp -r dist "$staging/"
          cp -r prompts "$staging/"
          cp -r eval/golden "$staging/golden"
          cp package.json package-lock.json README.md CLAUDE.md LICENSE "$staging/"
          cp -r docs "$staging/"
          # The lock file travels; the dependencies do not. better-sqlite3 is a
          # native module, and a copy built here would only ever be right for a
          # machine identical to this one. The target runs `npm ci --omit=dev`.
          cat > "$staging/INSTALL.md" <<'NOTE'
          # Installing

          Any Linux with Node 22. Developed on Rocky Linux 10, built and tested
          on Ubuntu.

          1. Install poppler — the PDF toolkit shells out to `pdftotext`,
             `pdftoppm` and `pdfinfo`:
             - Debian or Ubuntu: `sudo apt-get install -y poppler-utils`
             - Rocky or Fedora: `sudo dnf install -y poppler-utils`
          2. Node 22.
          3. `npm ci --omit=dev` in this directory, which builds better-sqlite3
             against the Node on the target rather than the one that built this.
          4. Copy `.env.example` from the repository and fill in credentials.
          5. `node dist/web/server/serve.js` for the site, or see `docs/` for the
             command-line entry points.

          Licensed under the GNU General Public License v3.0 or later; see
          `LICENSE`.
          NOTE
          sed -i 's/^          //' "$staging/INSTALL.md"
          tar -czf "dist-package/$name.tar.gz" -C dist-package "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "archive=dist-package/$name.tar.gz" >> "$GITHUB_OUTPUT"
          {
            echo "### Package"
            echo
            echo "\`$name.tar.gz\` — $(du -h "dist-package/$name.tar.gz" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the distribution
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          retention-days: 30

  e2e:
    name: Browser tests (Chromium in the pinned Playwright image)
    needs: build
    runs-on: ubuntu-latest
    # A screenshot baseline is a photograph of one machine's fonts and
    # rasterisation. This image pins both, along with the browser, so the
    # baselines in the repository can be reproduced anywhere — including on a
    # contributor's laptop — with `docker run` and the same tag (D78).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # The image's default shell is dash, which has no `pipefail`; every other
    # job gets bash from the runner image and these steps expect the same one.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The image carries the browser and its libraries, not the PDF toolkit;
      # the datasheet reader renders a page with pdftoppm while the tests watch.
      - name: Install poppler
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq poppler-utils

      - run: npm ci

      # The browser tests drive the built application, not the sources: the
      # server serves dist/ui, and a stale or missing build would test
      # nothing.
      - name: Build the front end
        run: npm run build:ui

      - name: Run the browser tests
        if: ${{ github.event.inputs.update_screenshots != 'true' }}
        env:
          CI: 'true'
        run: npm run test:e2e

      # A deliberate regeneration: the baselines are produced in the pinned
      # image and uploaded for a person to commit.
      - name: Regenerate the screenshot baselines
        if: ${{ github.event.inputs.update_screenshots == 'true' }}
        env:
          CI: 'true'
        run: npm run test:e2e:update

      - name: Upload the report and any screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            test/e2e/.report/
            test/e2e/.output/
            test/e2e/__screenshots__/playwright-noble/
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: Release
    needs: [check, build, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the distribution
        uses: actions/download-artifact@v8
        with:
          pattern: chip-datasheet-agent-*
          path: release
          merge-multiple: true

      - name: Attach it to the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          case "$tag" in
            *-*) prerelease="--prerelease" ;;
          esac
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes $prerelease
          fi
          gh release upload "$tag" release/*.tar.gz --clobber
